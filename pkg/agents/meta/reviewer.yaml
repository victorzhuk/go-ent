name: reviewer
description: Code reviewer. Reviews code for bugs, security, quality, adherence to conventions. Use after implementation is complete to validate before merging. Not for fixing code.
whenToUse: |
  Use after code is written and ready for review. Validates quality, security,
  adherence to conventions, and identifies issues.
  Do NOT use for: fixing bugs (use debugger), implementing features (use coder),
  writing tests (use tester), or validating requirements (use acceptor).
model: heavy
color: '#4169E1'
skills:
- go-review
- review-core
- security-core
- go-sec
- go-test
- go-observability
toolPresets:
- readonly
- serena-analysis
tools:
- list
- todoread
- todowrite
- skill
dependencies:
- coder
- architect
prompts:
  shared:
  - _tooling
  - _foundation
  - _workflow
  main: agents/reviewer
