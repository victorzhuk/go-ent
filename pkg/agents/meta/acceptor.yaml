name: acceptor
description: Validate acceptance criteria and requirements. Ensures implementation meets specifications. Use after implementation to verify requirements are met, distinct from code review.
whenToUse: |
  Use after implementation to verify that requirements and acceptance criteria are met.
  Focuses on functional correctness against specs, not code quality.
  Do NOT use for: code quality review (use reviewer), testing (use tester),
  or debugging (use debugger). Acceptor validates "did we build the right thing?"
model: main
color: '#4169E1'
skills:
- go-code
- go-test
- arch-core
toolPresets:
- readonly
- serena-analysis
tools:
- glob
- list
- todoread
- skill
dependencies:
- tester
- reviewer
prompts:
  shared:
  - _tooling
  - _foundation
  - _workflow
  main: agents/acceptor
