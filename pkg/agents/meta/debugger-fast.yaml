name: debugger-fast
description: Quick debugging for simple issues. Fast troubleshooting of obvious bugs. Use for clear error messages, typos, or single-line fixes.
whenToUse: |
  Use for simple, obvious bugs: typos, clear error messages, missing imports,
  or single-line fixes. Cost-optimized for speed.
  Do NOT use for: complex bugs (use debugger-heavy), multi-file issues (use debugger),
  or unclear failures (use debugger for systematic investigation).
extends: debugger
model: fast
color: '#DC143C'
skills:
- go-test
- debug-core
- go-code
toolPresets:
- editing
tools:
- list
- todoread
- todowrite
- skill
disallowedToolPresets:
- serena-editing
dependencies:
- tester
- coder
prompts:
  shared:
  - _tooling
  - _foundation
  - _workflow
  main: agents/debugger
