name: architect
description: System architect. Designs components, layers, data flow. Use for architecture decisions, API design, component boundaries, and system design before implementation.
whenToUse: |
  Use when making architectural decisions: designing new systems, defining APIs,
  establishing component boundaries, or planning data flow.
  Do NOT use for: implementing the architecture (use coder), breaking down tasks
  (use planner), or reviewing existing architecture (use reviewer).
model: heavy
color: '#4169E1'
skills:
- go-api
- api-design
- go-arch
- go-observability
- go-messaging
toolPresets:
- readonly
tools:
- list
- todoread
- todowrite
- skill
role: planning
complexity: heavy
dependencies:
- planner
- coder
prompts:
  shared:
  - _foundation
  - _tooling
  - _workflow
  main: agents/architect
