name: debugger
description: Standard debugging. Systematic issue investigation and resolution. Supports complexity routing. Use when something is broken, failing, or behaving unexpectedly.
whenToUse: |
  Use when encountering bugs, test failures, or unexpected behavior.
  Do NOT use for: writing new features (use coder), planning (use planner),
  or code review (use reviewer). Focus on fixing existing problems.
model: main
color: '#DC143C'
complexity: auto
complexityHints:
  simple: "Quick debugging for simple issues. Fast troubleshooting of obvious bugs."
  standard: "Standard debugging. Systematic investigation of moderate issues."
  complex: "Complex debugging. Concurrency issues, performance problems, multi-component failures."
modelMapping:
  simple: haiku
  standard: sonnet
  complex: opus
skills:
- go-test
- debug-core
- go-perf
- go-sec
- go-code
toolPresets:
- editing
tools:
- list
- todoread
- todowrite
- skill
disallowedToolPresets:
- serena-editing
dependencies:
- tester
- reviewer
- coder
prompts:
  shared:
  - _tooling
  - _foundation
  - _workflow
  main: agents/debugger
