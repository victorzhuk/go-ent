name: tester
description: Test engineer. Writes tests, TDD cycles, creates reproductions. Use when the task is specifically about writing or fixing tests, not when implementing features that need tests (coder handles that).
whenToUse: |
  Use when the task is purely about testing: writing test files, fixing broken tests,
  implementing TDD cycles, or creating bug reproductions.
  Do NOT use for: implementing features with tests (use coder), debugging production
  code (use debugger), or reviewing tests (use reviewer).
model: main
color: '#00FFFF'
role: execution
complexity: standard
skills:
- go-test
- debug-core
toolPresets:
- editing
tools:
- list
- todoread
- skill
disallowedToolPresets:
- serena-editing
dependencies: []
prompts:
  shared:
  - _tooling
  - _foundation
  - _workflow
  main: agents/tester
