name: reviewer
description: Code reviewer. Reviews code for bugs, security, quality, and adherence to project conventions.
model:
  claude: heavy
  opencode: heavy
opencode:
  mode: subagent
  hidden: true
skills:
  - go-code
tools:
  claude:
    allowed:
      - Read
      - Bash
      - Glob
      - Grep
    disallowed:
      - Write
      - Edit
  opencode:
    read: true
    bash: true
    glob: true
    grep: true
    write: false
    edit: false
prompts:
  shared:
    - conventions
    - judgment
    - tooling
    - principals
    - openspec
  main: reviewer
color: "#4169E1"
