version: 2

project_name: ent

before:
  hooks:
    - go mod tidy
    - go mod verify
    - go test ./...

builds:
  - id: ent
    main: ./cmd/ent
    binary: ent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/victorzhuk/go-ent/internal/version.version={{.Version}}
      - -X github.com/victorzhuk/go-ent/internal/version.vcsRef={{.ShortCommit}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git-cliff
  sort: asc

release:
  github:
    owner: victorzhuk
    name: go-ent
  prerelease: auto
  name_template: "v{{.Version}}"

homebrew_casks:
  - repository:
      owner: victorzhuk
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/victorzhuk/go-ent
    description: Enterprise Go development toolkit
    license: MIT
