 version: "2"

run:
  timeout: 5m
  go: '1.25'
  # Exclude generated files
  skip-dirs:
    - dist
    - bin

linters:
  enable:
    - errcheck        # Check for unchecked errors
    - errorlint       # Check for proper error wrapping and type assertions
    - unused          # Check for unused code
    - govet           # Vet examines Go source code
    - staticcheck     # Advanced Go linter (includes gosimple)
    - gocritic        # Opinionated linter
    - gosec           # Security issues
    - misspell        # Spell check
    - copyloopvar     # Go 1.22+ loop variable semantics
    - godot           # Check that comments end with periods
    - gocyclo         # Compute cyclomatic complexities
    - nilerr          # Check for nil errors returned from functions
    - noctx           # Check that no context is used directly
    - prealloc        # Find slice declarations that could potentially be preallocated
    - unconvert       # Remove unnecessary type conversions
    - unparam         # Find unused function parameters
    - wastedassign    # Detect wasted assignment statements
  disable-all: false
  
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt         # Check code formatting
    - goimports     # Check import formatting

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

  govet:
    enable-all: true

  goimports:
    local-prefixes: github.com/victorzhuk/go-ent

   gocritic:
     enabled-checks:
       - appendAssign
       - assignOp
       - boolExprSimplify
       - captLocal
       - commentFormatting
       - commentedOutCode
       - deprecatedComment
       - dupImport
       - elseif
       - emptyStringTest
       - equalFold
       - hexLiteral
       - ifElseChain
       - importShadow
       - indexAlloc
       - initClause
       - methodExprCall
       - nilValReturn
       - preferStringWriter
       - rangeExprCopy
       - regexpMust
       - singleCaseSwitch
       - sloppyLen
       - stringXbytes
       - suggestedName
       - typeAssertChain
       - typeDefFirst
       - underef
       - unlambda
       - unslice
       - weakCond

   gocyclo:
     min-complexity: 15

   errorlint:
    errorf: true
    asserts: true

  revive:
    confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

   exclude-rules:
     # Exclude some linters from running on tests files
     - path: _test\.go$
       linters:
         - errcheck
         - gosec
         - noctx
         - wastedassign

     # Skip generated code
     - path: generated/
       linters:
         - all

